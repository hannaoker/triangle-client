[package]
name = "peer-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
description = "Triangle peer connectivity engine (iroh): device identity, journaled message/receipt exchange, and versioned local Unix IPC."
repository = "https://github.com/hannaoker/triangle-client"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
hex = "0.4"
iroh = "1.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "peer-engine"
path = "src/main.rs"
